owner: quividi
repo: status

# Only VidiCenter's /healthz/ checks the database and Redis; the other probes
# only prove the app answers (a 401/405 from Django or uvicorn, not nginx).
sites:
  - name: VidiCenter
    url: https://vidicenter.quividi.com/healthz/
    icon: https://status.quividi.com/icons/vidicenter.ico
  - name: VidiReports API
    url: https://api.quividi.com/v1/upload
    icon: https://status.quividi.com/icons/vidicenter.ico
    expectedStatusCodes:
      - 405
  - name: Cloud API
    url: https://vidicenter.quividi.com/api/v1/whoami/
    icon: https://status.quividi.com/icons/vidicenter.ico
    expectedStatusCodes:
      - 401
  - name: Quiotto
    url: https://quiotto.quividi.com/login/
    icon: https://status.quividi.com/icons/quiotto.ico
  - name: MCP server
    url: https://mcp.quividi.com/mcp
    icon: https://status.quividi.com/icons/quiotto.ico
    expectedStatusCodes:
      - 401

assignees:
  - jgb

status-website:
  # Needs the OVH record: status CNAME quividi.github.io.
  cname: status.quividi.com
  # Files from assets/, served from the site root; nothing loads from our servers. Absolute
  # URLs: the Sapper export crawls same-origin paths and turns them into directories, which
  # then breaks Upptime's copy of assets/ (EISDIR).
  themeUrl: https://status.quividi.com/quiotto.css
  logoUrl: https://status.quividi.com/quividi_white.png
  logoHref: /
  hideNavTitle: true
  favicon: https://status.quividi.com/icons/vidicenter.ico
  name: Quividi Status
  introTitle: "Quividi service status"
  introMessage: Current availability of VidiCenter, the VidiReports API, the Cloud API, Quiotto and the MCP server, and our updates during incidents and maintenance.
  navbar:
    - title: Status
      href: /
    - title: VidiCenter
      href: https://vidicenter.quividi.com/
      target: _blank
    - title: Quiotto
      href: https://quiotto.quividi.com/
      target: _blank
    - title: quividi.com
      href: https://www.quividi.com/
      target: _blank
